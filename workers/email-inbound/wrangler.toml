# Cloudflare Email Worker for VenderCRM mailboxes (PLAN-EMAIL.md E2).
# Deploy: npm install && npx wrangler deploy
# Secret: npx wrangler secret put EMAIL_INBOUND_SECRET  (same value as the app)
name = "vendercrm-email-inbound"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Retry queue for deliveries the app did not accept (see src/index.ts).
[triggers]
crons = ["*/5 * * * *"]

# Must be the same bucket the app reads with STORAGE_DRIVER=s3 / S3_BUCKET.
[[r2_buckets]]
binding = "MAIL_BUCKET"
bucket_name = "vendercrm-storage"

# Email Sending events (bounces, complaints) for the circuit breaker. Create
# the queue, then an event subscription on each sending domain that
# publishes to it (PLAN-EMAIL.md E5, docs/log/e5.md).
[[queues.consumers]]
queue = "vendercrm-email-events"
max_batch_size = 50
max_batch_timeout = 30

[vars]
INBOUND_URL = "https://crm.example.com/api/v1/email/inbound"
EVENTS_URL = "https://crm.example.com/api/v1/email/events"
