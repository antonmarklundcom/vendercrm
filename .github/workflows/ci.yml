name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/vendercrm
  APP_ENCRYPTION_KEY: aa1188c9c4f0d2e6b7a35f0091c2d8e4b6a7c1f3d9e0a2b4c6d8e0f2a4b6c8d0
  CRON_SECRET: ci-dummy-secret
  APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-0123456789

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vendercrm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
