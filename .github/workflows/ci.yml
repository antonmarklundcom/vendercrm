name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/vendercrm
  APP_ENCRYPTION_KEY: aa1188c9c4f0d2e6b7a35f0091c2d8e4b6a7c1f3d9e0a2b4c6d8e0f2a4b6c8d0
  CRON_SECRET: ci-dummy-secret
  APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
  WHATSAPP_APP_SECRET: ci-dummy-whatsapp-app-secret
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ci-dummy-whatsapp-verify-token
  # Selects an AI driver so the 1O end-to-end suite runs instead of skipping.
  # No real request ever leaves CI — those tests stub fetch — but the driver
  # has to resolve to something for the guarded path to be exercised at all.
  AI_DRIVER: openai
  OPENAI_API_KEY: ci-dummy-openai-key
  AI_BASE_URL: http://127.0.0.1:9/unused

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:migrations
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vendercrm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
